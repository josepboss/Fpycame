{% extends "base.html" %}
{% block content %}
{% if flash %}
<div class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded mb-4" role="alert">
    <span class="block sm:inline">{{ flash }}</span>
</div>
{% endif %}
<h1 class="text-2xl font-bold mb-4">Lot Mapping</h1>
<div class="mb-8">
    <h2 class="text-xl font-semibold mb-2">Add / Edit Lot</h2>
    <form action="/lots/save" method="post" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <input type="text" name="lot_name" placeholder="Lot Name (Exact FunPay Title)" class="border p-2 rounded" required>
        <select name="provider" class="border p-2 rounded" id="providerSelect" onchange="updateIdHint()">
            <option value="hstore">HStore</option>
            <option value="smmcost">SMMCost</option>
            <option value="dark">Dark Shopping</option>
            <option value="djekxa">Djekxa</option>
        </select>
        <input type="text" name="item_id" id="itemId" placeholder="Product / Service ID" class="border p-2 rounded" required>
        <label class="flex items-center space-x-2">
            <input type="checkbox" name="enabled" value="true" checked>
            <span>Enabled</span>
        </label>
        <button type="submit" class="bg-blue-600 text-white p-2 rounded hover:bg-blue-700">Save Lot</button>
    </form>
</div>
<table class="min-w-full bg-white">
    <thead>
        <tr>
            <th class="py-2 px-4 border-b text-left">Lot Name</th>
            <th class="py-2 px-4 border-b text-left">Provider</th>
            <th class="py-2 px-4 border-b text-left">ID</th>
            <th class="py-2 px-4 border-b text-left">Enabled</th>
            <th class="py-2 px-4 border-b text-left">Actions</th>
        </tr>
    </thead>
    <tbody>
        {% for lot in lots %}
        <tr>
            <td class="py-2 px-4 border-b">{{ lot.name }}</td>
            <td class="py-2 px-4 border-b">{{ lot.provider }}</td>
            <td class="py-2 px-4 border-b">{{ lot.id }}</td>
            <td class="py-2 px-4 border-b">{{ "Yes" if lot.enabled else "No" }}</td>
            <td class="py-2 px-4 border-b">
                <form action="/lots/delete" method="post" onsubmit="return confirm('Delete offer mapping for \"{{ lot.name }}\"? This will also remove the auto-delivery config and stock file.')" style="display:inline;">
                    <input type="hidden" name="lot_name" value="{{ lot.name }}">
                    <button type="submit" class="text-red-600 hover:underline bg-transparent border-none cursor-pointer">Delete</button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>

<script>
function updateIdHint() {
    var provider = document.getElementById('providerSelect').value;
    var input = document.getElementById('itemId');
    if (provider === 'smmcost') {
        input.placeholder = 'Service ID (from SMMCost)';
    } else {
        input.placeholder = 'Product ID (from provider)';
    }
}
// Run once on page load
updateIdHint();
</script>
{% endblock %}
